name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install dependencies
      run: uv sync --dev
    - name: Run ruff check
      run: uv run ruff check .
    - name: Run ruff format
      run: uv run ruff format --check .